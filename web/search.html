<title>Vault Search</title>

/* Vault Search. Layout: a deep-teal reading-room band with a shelf of book spines along its edge; the search box sits on the shelf.
   Results are index cards whose left spine is the colour of their shelf. Everything is bundled: nothing loads from the internet. */
:root {
  --band: #123d3c; --band-ink: #f1efe6; --band-muted: #a9c3bf;
  --paper: #eef0ec; --card: #ffffff; --ink: #1a1d1b; --muted: #59615c; --rule: #d3d8d3;
  --ochre: #e0a63e; --ochre-ink: #1a1d1b; --link: #12605d; --mark: #fbe3a6;
  --s-core: #3d5a80; --s-health: #b5483b; --s-land: #5f7f3a; --s-repair: #c47f2c; --s-code: #6a4c93; --s-learn: #2a7f86; --s-maps: #8a6f4e;
  --display: "Young Serif", Georgia, "Noto Serif", serif;
  --body: "Atkinson", "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans Devanagari", "Microsoft YaHei", Arial, sans-serif;
  --scale: 1;
}
@media (prefers-color-scheme: dark) { :root {
  --band: #0b2625; --band-ink: #ecebe2; --band-muted: #8fb0ab;
  --paper: #111413; --card: #1a1e1c; --ink: #e8ebe7; --muted: #a3aca6; --rule: #2b312e;
  --ochre: #e7b04c; --ochre-ink: #111413; --link: #7fd0c8; --mark: #5a4a1c; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: calc(18px * var(--scale)); line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
a { color: var(--link); }
[hidden] { display: none !important; }
.wrap { width: 100%; max-width: 860px; margin: 0 auto; padding-inline: 18px; }

/* the band */
.band { background: var(--band); color: var(--band-ink); position: relative; }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: calc(20px * var(--scale)); background: none; border: 0; padding: 0; cursor: pointer; color: var(--band-ink); white-space: nowrap; }
.grow { flex: 1; }
.lang { position: relative; }
.bubble { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--band-muted); background: transparent; color: var(--band-ink); font-weight: 700; font-size: 14px; cursor: pointer; letter-spacing: .04em; }
.bubble:hover { border-color: var(--ochre); }
.menu { position: absolute; top: 52px; inset-inline-start: 0; background: var(--card); color: var(--ink); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.28); padding: 6px; z-index: 20; min-width: 210px; }
.menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: start; background: none; border: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--paper); }
.menu button span { color: var(--muted); font-size: 13px; white-space: nowrap; }
#fixline a { font-weight: 700; }
.sizes { display: flex; gap: 4px; }
.sizes button { background: transparent; border: 1px solid var(--band-muted); color: var(--band-ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 700; font-size: 15px; }
.home { padding-block: 36px 0; }
.home h1 { font-family: var(--display); font-weight: 400; font-size: calc(clamp(36px, 6vw, 58px) * var(--scale)); line-height: 1.08; margin: 0 0 10px; text-wrap: balance; }
.home .sub { color: var(--band-muted); margin: 0 0 24px; }
form.box { display: flex; gap: 0; border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
form.box input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-size: calc(22px * var(--scale)); padding: 15px 18px; outline: none; }
form.box:focus-within { outline: 3px solid var(--ochre); outline-offset: 2px; }
form.box button { background: var(--ochre); color: var(--ochre-ink); border: 0; padding: 0 26px; font-weight: 700; cursor: pointer; font-size: calc(19px * var(--scale)); }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; color: var(--band-muted); }
.idea { background: rgba(255,255,255,.08); color: var(--band-ink); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: calc(16px * var(--scale)); }
.idea:hover { border-color: var(--ochre); }
.links { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; padding-bottom: 26px; }
.links button, .links a { background: none; border: 0; padding: 0; color: var(--band-ink); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; font-size: calc(16px * var(--scale)); }
.shelf { height: 64px; display: flex; align-items: flex-end; gap: 2px; overflow: hidden; padding-inline: 18px; border-bottom: 8px solid #6b4f33; }
.spine { flex: none; border-radius: 2px 2px 0 0; position: relative; transform-origin: bottom; }
.spine::before, .spine::after { content: ""; position: absolute; left: 3px; right: 3px; height: 2px; background: rgba(255,255,255,.35); }
.spine::before { top: 9px; } .spine::after { top: 14px; }
@media (prefers-reduced-motion: no-preference) { .spine { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; } }
@keyframes rise { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
.note { margin: 18px 0 0; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,.1); color: var(--band-ink); font-size: calc(16px * var(--scale)); }

/* results */
.top form.box { flex: 1 1 300px; }
.top form.box input { font-size: calc(18px * var(--scale)); padding: 10px 14px; }
.top form.box button { padding: 0 18px; font-size: calc(17px * var(--scale)); }
main { flex: 1; }
.status { margin: 20px 0 10px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: calc(15.5px * var(--scale)); }
.chip i { width: 10px; height: 14px; border-radius: 2px; background: var(--c, var(--muted)); }
.chip.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
.results { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.results button { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; background: var(--card); border: 1px solid var(--rule); border-inline-start: 7px solid var(--c, var(--muted)); border-radius: 8px; padding: 14px 18px; }
.results button:hover { border-color: var(--ink); border-inline-start-color: var(--c, var(--muted)); }
.results button:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.results b { display: block; font-family: var(--display); font-weight: 400; font-size: calc(22px * var(--scale)); line-height: 1.25; color: var(--ink); }
.results .from { font-size: calc(14.5px * var(--scale)); color: var(--muted); }
.results .snip { display: block; margin-top: 6px; }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }
.spin::after { content: ""; display: inline-block; width: .8em; height: .8em; border: 3px solid var(--ochre); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; margin-inline-start: 10px; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin::after { animation: none; } }
.soft { color: var(--muted); font-size: calc(15px * var(--scale)); }
footer { padding-block: 30px; color: var(--muted); font-size: calc(15px * var(--scale)); }
footer p { margin: 0 0 6px; max-width: 46em; }

/* reading */
.reader { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--paper); z-index: 30; }
.reader .bar { padding-inline: 14px; background: var(--band); color: var(--band-ink); }
.reader .t { flex: 1; min-width: 0; }
.reader .t b { display: block; font-family: var(--display); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reader .t span { font-size: calc(14px * var(--scale)); color: var(--band-muted); }
.back { background: var(--ochre); color: var(--ochre-ink); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
.reader iframe { flex: 1; border: 0; width: 100%; background: #fff; }
.reader .foot { padding: 6px 14px; font-size: calc(13px * var(--scale)); color: var(--muted); border-top: 1px solid var(--rule); }
@media (max-width: 560px) { .sizes { display: none; } .home { padding-top: 20px; } }
</style>
</head>
<body>
<header class="band">
  <div class="wrap bar">
    <div class="lang">
      <button class="bubble" id="bubble" aria-haspopup="true" aria-expanded="false" title="Language">EN</button>
      <div class="menu" id="menu" role="menu" hidden></div>
    </div>
    <button class="brand" onclick="goHome()">Vault Search</button>
    <form class="box top-only" id="topform" hidden onsubmit="event.preventDefault(); search(document.getElementById('q2').value)">
      <input id="q2" type="search" autocomplete="off"><button type="submit" data-t="search"></button>
    </form>
    <span class="grow"></span>
    <div class="sizes" role="group"><button onclick="zoom(-1)" data-tt="smaller">A-</button><button onclick="zoom(1)" data-tt="bigger">A+</button></div>
  </div>
  <div class="wrap home" id="home">
    <h1 data-t="title"></h1>
    <p class="sub" id="stat"></p>
    <form class="box" onsubmit="event.preventDefault(); search(document.getElementById('q').value)">
      <input id="q" type="search" autocomplete="off" autofocus><button type="submit" data-t="search"></button>
    </form>
    <div class="ideas" id="ideas"></div>
    <div id="setup"></div>
    <div class="links"><button onclick="surprise()" data-t="random"></button><a href="/vault.html" data-t="browse"></a></div>
  </div>
  <div class="shelf" id="shelf" aria-hidden="true"></div>
</header>

<main class="wrap" id="res" hidden>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="chips" id="chips"></div>
  <ul class="results" id="list"></ul>
  <p class="soft" id="more"></p>
</main>

<footer class="wrap" id="foot">
  <p data-t="limits"></p>
  <p id="langnote"></p>
  <p id="fixline" hidden><a id="fixlink" target="_blank" rel="noopener"></a> <span id="fixhow"></span></p>
</footer>

<div class="reader" id="reader" hidden>
  <div class="bar">
    <button class="back" id="backbtn" onclick="closePage()"></button>
    <div class="t"><b id="rtitle"></b><span id="rfrom"></span></div>
    <div class="sizes" role="group"><button onclick="zoom(-1)" data-tt="smaller">A-</button><button onclick="zoom(1)" data-tt="bigger">A+</button></div>
  </div>
  <iframe id="frame" title="Page" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
  <div class="foot" id="rcredit"></div>
</div>

  hi: { draft: "मसौदा", fix: "इस अनुवाद को ठीक करने में मदद करें", fixhow: "कोई शब्द गलत दिखा? सही शब्द यहाँ सुझाएँ, या जिसने आपको यह ड्राइव दी उसे बताएँ।", title: "पुस्तकालय में खोजें", stat: "{n} संग्रह, {size}, सब इसी कंप्यूटर पर। इंटरनेट की ज़रूरत नहीं।", ph: "आप क्या जानना चाहते हैं?", search: "खोजें", try: "आज़माएँ:",

  zh: { draft: "草稿", fix: "帮助改进此翻译", fixhow: "发现翻译错误？请在这里提出正确的说法，或告诉给你这个硬盘的人。", title: "搜索图书馆", stat: "{n} 个资料集，{size}，全部在这台电脑上。无需联网。", ph: "你想了解什么？", search: "搜索", try: "试试：",
    random: "随便看看", browse: "浏览所有书架", limits: "这是一个图书馆，不是医生、工程师或老师。页面内容可能已过时。遇到紧急或危险情况时，请尽量联系受过训练的人。",
    found: "找到 {n} 个关于 {q} 的页面。", none: "没有找到关于 {q} 的内容。试试少用几个词，或换一个意思相同的词。", looking: "正在搜索", sofar: "目前找到 {n} 个。仍在页面中搜索",
    all: "全部", from: "来自 {p}", back: "返回", backres: "返回结果", slow: "一些非常大的资料集太慢，暂时跳过：{list}。选择一个主题可以缩小搜索范围。",
    nolib: "还没有找到图书馆。请把本程序放在 Vault 硬盘的 zim 文件夹旁边，或运行一个 Get 文件。", smaller: "缩小文字", bigger: "放大文字", version: "版本 {d}。",
    langnote: "大部分资料是英文的。有中文结果时会优先显示。此翻译可能有错误。",
    ideas: ["饮用水", "疟疾", "太阳能", "急救"],
    shelves: { core: "百科与图书", health: "健康", land: "农业、水和能源", repair: "维修与电子", code: "电脑与编程", learn: "学校与学习", maps: "地图" } },
};
const SHELF_ORDER = ["core", "health", "land", "repair", "code", "learn", "maps"];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m);
let L = "en", cat = null, shelfOf = {}, scale = 1, token = 0;
let state = { q: "", shelf: "", results: [], busy: false, skipped: [] };
try { scale = +localStorage.getItem("search.scale") || 1; L = localStorage.getItem("search.lang") || ""; } catch (e) {}
if (!T[L]) { const nav = (navigator.language || "en").slice(0, 2); L = T[nav] ? nav : "en"; }
const t = k => (T[L][k] != null ? T[L][k] : T.en[k]);

function applyLang() {
  const info = LANGS.find(x => x[0] === L);
  document.documentElement.lang = L; document.documentElement.dir = info[3];
  $("bubble").textContent = L.toUpperCase();
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll("[data-tt]")) { el.title = t(el.dataset.tt); el.setAttribute("aria-label", t(el.dataset.tt)); }
  $("q").placeholder = t("ph"); $("q").setAttribute("aria-label", t("search")); $("q2").setAttribute("aria-label", t("search"));
  $("ideas").innerHTML = `<span>${esc(t("try"))}</span>` + t("ideas").map(w => `<button class="idea" onclick="search(${esc(JSON.stringify(w))})">${esc(w)}</button>`).join("");
  $("langnote").textContent = t("langnote");
  $("fixline").hidden = L === "en";
  $("fixlink").textContent = t("fix"); $("fixhow").textContent = t("fixhow");
  $("fixlink").href = PROJECT + "/issues/new?template=translation.md&title=" + encodeURIComponent("Translation fix: " + LANGS.find(x => x[0] === L)[1]) + "&labels=translation";
  $("menu").innerHTML = LANGS.map(([c, name]) => `<button role="menuitemradio" aria-checked="${c === L}" onclick="setLang('${c}')">${esc(name)}<span>${c === "en" ? "EN" : esc(T[c].draft) + " · " + c.toUpperCase()}</span></button>`).join("");
  showStat();
  if (!$("res").hidden) draw();
}
function setLang(c) { L = c; try { localStorage.setItem("search.lang", c); } catch (e) {} toggleMenu(false); applyLang(); if (state.q) search(state.q, state.shelf); }
function toggleMenu(open) { $("menu").hidden = !open; $("bubble").setAttribute("aria-expanded", String(open)); if (open) $("menu").querySelector("[aria-checked=true]").focus(); }
$("bubble").onclick = e => { e.stopPropagation(); toggleMenu($("menu").hidden); };
document.addEventListener("click", e => { if (!$("menu").hidden && !$("menu").contains(e.target)) toggleMenu(false); });

function zoom(d) {
  scale = Math.min(1.6, Math.max(0.85, +(scale + d * 0.15).toFixed(2)));
  document.documentElement.style.setProperty("--scale", scale);
  try { localStorage.setItem("search.scale", scale); } catch (e) {}
}
document.documentElement.style.setProperty("--scale", scale);

function buildShelf() {   // a row of book spines, the same every time
  const colors = SHELF_ORDER.map(s => `var(--s-${s})`).concat(["#d8cdb0", "#1f2a2a", "#9c4f2f"]);
  let seed = 7, html = "", width = 0;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  while (width < 2200) {
    const w = 12 + Math.floor(rnd() * 16), h = 62 + Math.floor(rnd() * 38), lean = rnd() < .04;
    html += `<span class="spine" style="width:${w}px;height:${h}%;background:${colors[Math.floor(rnd() * colors.length)]};animation-delay:${(width / 2200 * .5).toFixed(2)}s${lean ? ";transform:rotate(-8deg)" : ""}"></span>`;
    width += w + 2;
    if (rnd() < .06) { html += `<span style="flex:none;width:${18 + Math.floor(rnd() * 40)}px"></span>`; width += 40; }
  }
  $("shelf").innerHTML = html;
}

async function api(what, params) {
  const r = await fetch("/api/vault/" + what + (params ? "?" + new URLSearchParams(params) : ""));
  return r.json();
}
function packName(s) { return String(s || "").replace(/\s*\(.*\)\s*$/, ""); }
function showStat() {
  if (!cat) return;
  if (cat.error || !cat.packs) { $("stat").textContent = ""; $("setup").innerHTML = `<p class="note">${esc(cat.error || t("nolib"))}</p>`; return; }
  $("setup").innerHTML = "";
  $("stat").textContent = fill(t("stat"), { n: cat.packs, size: cat.size });
}
async function load() {
  buildShelf(); applyLang();
  cat = await api("catalog");
  shelfOf = {}; for (const s of cat.shelves || []) for (const p of s.packs) shelfOf[p.id] = s.id;
  showStat();
  if (location.hash.startsWith("#q=")) search(decodeURIComponent(location.hash.slice(3)));
}
function goHome() { $("home").hidden = false; $("shelf").hidden = false; $("res").hidden = true; $("topform").hidden = true; $("q").value = ""; $("q").focus(); state.q = ""; history.replaceState(null, "", "#"); }

async function search(q, shelf) {
  q = (q || "").trim(); if (!q) return;
  const tok = ++token;
  state = { q, shelf: shelf || "", results: [], busy: true, skipped: [] };
  $("home").hidden = true; $("shelf").hidden = true; $("res").hidden = false; $("topform").hidden = false; $("q2").value = q;
  history.replaceState(null, "", "#q=" + encodeURIComponent(q));
  draw();
  const scope = state.shelf ? "shelf:" + state.shelf : "all";
  const lang = LANGS.find(x => x[0] === L)[2];
  for (const mode of ["title", "text"]) {
    const d = await api("search", { q, scope, mode, lang });
    if (tok !== token) return;
    if (d.error) { state.error = d.error; break; }
    const key = r => r.id + "|" + String(r.title).toLowerCase().trim();
    const seen = new Map(state.results.map(r => [key(r), r]));
    for (const r of d.results || []) {
      const old = seen.get(key(r)) || state.results.find(x => x.id === r.id && x.path === r.path);
      if (!old) { state.results.push(r); seen.set(key(r), r); }
      else if ((r.score || 0) > (old.score || 0)) { old.score = r.score; if (!old.snippet) old.snippet = r.snippet; }
    }
    state.results.sort((a, b) => (b.score || 0) - (a.score || 0));
    state.skipped = [...new Set([...state.skipped, ...(d.skipped || [])])];
    draw();
  }
  state.busy = false; draw();
}
function hl(text, q) {
  let h = esc(text);
  for (const w of q.split(/\s+/).filter(w => w.length > 2)) h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"), "<mark>$1</mark>");
  return h;
}
function draw() {
  const s = state, Q = `<b>${esc(s.q)}</b>`;
  $("status").innerHTML = s.error ? esc(s.error) : s.busy ? `<span class="spin">${s.results.length ? fill(esc(t("sofar")), { n: s.results.length }) : esc(t("looking"))}</span>` :
    s.results.length ? fill(esc(t("found")), { n: s.results.length, q: Q }) : fill(esc(t("none")), { q: Q });
  const have = SHELF_ORDER.filter(k => cat && (cat.shelves || []).some(x => x.id === k));
  $("chips").innerHTML = `<button class="chip ${s.shelf ? "" : "on"}" onclick="search(state.q, '')">${esc(t("all"))}</button>` +
    have.map(k => `<button class="chip ${s.shelf === k ? "on" : ""}" style="--c:var(--s-${k})" onclick="search(state.q, '${k}')"><i></i>${esc(t("shelves")[k])}</button>`).join("");
  $("list").innerHTML = s.results.map((r, i) => `<li><button style="--c:var(--s-${shelfOf[r.id] || "core"})" onclick="openPage(${i})"><b>${esc(r.title)}</b>
    <span class="from">${esc(fill(t("from"), { p: packName(r.pack) }))}</span>${r.snippet ? `<span class="snip">${hl(r.snippet, s.q)}</span>` : ""}</button></li>`).join("");
  $("more").textContent = !s.busy && s.skipped.length ? fill(t("slow"), { list: s.skipped.map(packName).join(", ") }) : "";
}
function pageUrl(id, path) {
  const base = "http://127.0.0.1:" + cat.port, p = path.split("/").map(encodeURIComponent).join("/");
  return id.startsWith("r:") ? `${base}/r/${encodeURIComponent(id.slice(2))}/${p}` : `${base}/z/${encodeURIComponent(id)}/${p}`;
}
async function openPage(i, item) {
  const r = item || state.results[i];
  $("rtitle").textContent = r.title; $("rfrom").textContent = fill(t("from"), { p: packName(r.pack) });
  $("backbtn").textContent = (document.documentElement.dir === "rtl" ? "→ " : "← ") + t(item ? "back" : "backres");
  $("rcredit").textContent = "";
  $("frame").src = pageUrl(r.id, r.path);
  $("reader").hidden = false; document.body.style.overflow = "hidden";
  const p = await api("pack", { id: r.id });
  if (!p.error) $("rcredit").textContent = (p.credit ? p.credit + " " : "") + (p.date ? fill(t("version"), { d: p.date }) : "");
}
function closePage() { $("reader").hidden = true; $("frame").src = "about:blank"; document.body.style.overflow = ""; }
window.addEventListener("message", e => {
  if (e.source !== $("frame").contentWindow || !e.data || !e.data.archieVault) return;
  if (e.data.title) $("rtitle").textContent = e.data.title;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("reader").hidden) closePage(); else if (!$("menu").hidden) toggleMenu(false); }
});
async function surprise() {
  const r = await api("random", { scope: "all" });
  if (r.error) { $("setup").innerHTML = `<p class="note">${esc(r.error)}</p>`; return; }
  openPage(0, r);
}
load();
</script>
