name: Build Vault Search
# Builds "Vault Search.exe" on a Windows machine at GitHub, so nobody needs Python.
# Runs when you push a tag like v1.0, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller libzim
      - run: pyinstaller --onefile --name "Vault Search" --collect-all libzim --add-data "web;web" --add-data "tools/packs.csv;tools" tools/vault_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vault-Search-windows
          path: dist/Vault Search.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vault Search.exe
